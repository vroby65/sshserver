[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshserver"
version = "0.2.0"
description = "Controlla OpenSSH dal tray X11."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
sshserver = "sshserver:main"

[tool.setuptools]
py-modules = ["sshserver"]
